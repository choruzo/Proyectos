{% from "_icons.html" import icon %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Iniciar sesión · GALTTCMC CI/CD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b3a2b'/><circle cx='9' cy='16' r='3' fill='%2334d399'/><circle cx='23' cy='9' r='3' fill='%2334d399'/><circle cx='23' cy='23' r='3' fill='%2334d399'/><path d='M12 16h3a4 4 0 004-4v-1M15 16a4 4 0 014 4v1' stroke='%2334d399' stroke-width='2' fill='none'/></svg>">
</head>
<body>
<div class="center-page">
    <div class="auth">
        <div class="brand">
            <div class="brand-mark">{{ icon('pipeline') }}</div>
            <div>
                <div class="brand-name">GALTTCMC</div>
                <div class="brand-sub">ci/cd · pipeline monitor</div>
            </div>
        </div>

        <div class="card">
            <form class="card-body" method="POST"
                  action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') | urlencode }}{% endif %}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <div class="prompt"><b>$</b> ssh agent@172.30.188.137</div>
                    <h2 style="margin-top:.35rem">Iniciar sesión</h2>
                </div>

                {% if error %}
                <div class="notice err" role="alert">{{ icon('alert', 'ico-sm') }}<span>{{ error }}</span></div>
                {% endif %}

                <div class="field">
                    <label for="username">Usuario</label>
                    <input class="input" type="text" id="username" name="username" required autocomplete="username" autofocus>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn primario" style="width:100%;margin-top:.35rem">Entrar {{ icon('arrow-right', 'ico-sm') }}</button>
            </form>
        </div>

        <div class="foot">SUSE Linux 15 · 172.30.188.137</div>
    </div>
</div>
</body>
</html>
