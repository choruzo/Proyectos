{% from "_icons.html" import icon %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>500 · GALTTCMC CI/CD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="center-page">
    <div class="err-page">
        <div class="prompt"><b>$</b> exit status 1</div>
        <div class="err-code fail" style="margin-top:.8rem">500</div>
        <h1>Error interno del servidor</h1>
        <p>Algo ha fallado en el servidor. Revisa <span class="mono">logs/web_error.log</span> o inténtalo de nuevo.</p>
        <div class="actions">
            <a href="{{ url_for('index') }}" class="btn primario" style="text-decoration:none">{{ icon('arrow-left', 'ico-sm') }} Volver al dashboard</a>
            <button type="button" class="btn" onclick="location.reload()">{{ icon('refresh', 'ico-sm') }} Reintentar</button>
        </div>
    </div>
</div>
</body>
</html>
